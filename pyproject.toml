[project]
name = "overseer"
version = "0.1.0"
description = "Semantic review of agentic code changes"
authors = [
    { name = "quikli", email = "8772312+Steven-Wilson@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
overseer = "overseer.tui:main"
overseer-cli = "overseer.cli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
